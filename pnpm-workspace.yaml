packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
# pnpm refuses package versions published less than a day ago (supply-chain
# guard). These exact Expo SDK 58 versions were hours old when the app was
# created, and Expo Go only runs JS that matches the native modules it ships,
# so they are pinned as `expo install` chose them instead of to older patches.
# Exact versions only: future releases still have to age a day.
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.19"
  - "@expo/config-plugins@58.0.12"
  - "@expo/config@58.0.11"
  - "@expo/env@2.5.4"
  - "@expo/fingerprint@0.21.9"
  - "@expo/inline-modules@0.2.9"
  - "@expo/local-build-cache-provider@58.0.11"
  - "@expo/log-box@58.0.15"
  - "@expo/metro-config@58.0.21"
  - "@expo/metro-runtime@58.0.17"
  - "@expo/prebuild-config@58.0.19"
  - "@expo/router-server@58.0.21"
  - "@expo/ui@58.0.27"
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-linking@58.0.16
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo-router@58.0.30
  - expo-splash-screen@58.0.13
  - expo@58.0.23
  - react-native-safe-area-context@5.11.1
