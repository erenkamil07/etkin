# Local infrastructure. `pnpm infra:up` starts postgres + redis only. The api
# and worker services are behind the "app" profile (`pnpm app:up`) so they don't
# clash with `pnpm dev` / `pnpm dev:worker`, which run on the host with hot reload.
name: etkin

# Shared by the api and worker containers (dev-only secrets).
x-app-environment: &app-environment
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://etkin:etkin@postgres:5432/etkin
  REDIS_URL: redis://redis:6379/0
  JWT_ACCESS_SECRET: dev-only-insecure-jwt-secret-change-me-0123456789
  QR_MASTER_KEY: moVtnpTD1KcuHtr3L0d+xIKgi1uAY8QXejCOGpvfe2U=

x-app-build: &app-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: etkin
      POSTGRES_PASSWORD: etkin
      POSTGRES_DB: etkin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres 18 images keep PGDATA under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etkin -d etkin"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build: *app-build
    environment: *app-environment
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Same image, different entry point: drains the outbox (badges) and does housekeeping.
  worker:
    profiles: ["app"]
    build: *app-build
    command: ["node", "dist/worker.js"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
