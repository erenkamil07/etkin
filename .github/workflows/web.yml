name: Website

# The web build of the app on GitHub Pages: how iPhone users get Etkin until
# it is in the App Store. It talks to the production API, which must list
# https://<owner>.github.io in CORS_ORIGINS.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export the web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Export
        working-directory: apps/mobile
        env:
          # Pages serves the site at https://<owner>.github.io/<repository>/.
          EXPO_WEB_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_API_URL: https://etkin-production.up.railway.app
        run: pnpm web:export
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/mobile/dist
          # The fonts are exported under assets/__node_modules/.pnpm/...; without this the
          # dot folder is left out and the site falls back to the browser's default font.
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
